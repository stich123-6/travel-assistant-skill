[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "soco-travel-assistant-mcp"
version = "2.0.0"
description = "A persistent, user-scoped travel assistant MCP service for WorkBuddy"
requires-python = ">=3.13"
dependencies = ["mcp==2.3.0", "uvicorn==0.54.0", "cryptography==49.0.0", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
include = ["travel_mcp*"]
